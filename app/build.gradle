plugins { id 'com.android.application' version '8.10.1' }
android {
    namespace 'tj.builder.v1'
    buildFeatures { buildConfig true }
    flavorDimensions += "distribution"
    productFlavors {
        direct { dimension "distribution"; buildConfigField 'boolean', 'DIRECT_UPDATE', 'true' }
        play { dimension "distribution"; buildConfigField 'boolean', 'DIRECT_UPDATE', 'false' }
    }
    buildTypes {
        debug { applicationIdSuffix '.l10n' }
    }
    compileSdk 36
    defaultConfig { applicationId 'tj.builder.app'; minSdk 28; targetSdk 36; versionCode 3; versionName '1.0.2'
        def feed = providers.gradleProperty("builderUpdateFeed").orElse("").get()
        if (feed && !(feed ==~ /https:\/\/[A-Za-z0-9._~:\/?&=%+-]+/)) throw new GradleException("Invalid HTTPS feed URL")
        buildConfigField 'String', 'UPDATE_FEED', '"' + feed + '"'
    }
    sourceSets { main.assets.srcDir layout.buildDirectory.dir('generated/viewerAsset') }
    packaging.resources.excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
}
dependencies {
    implementation 'com.android.tools.build:apksig:8.10.1'
    playImplementation 'com.google.android.play:app-update:2.1.0'
}
tasks.register('stageViewer', Copy) {
    dependsOn ':viewer:assembleOfflineRelease', ':viewer:assembleOnlineRelease'
    from(project(':viewer').layout.buildDirectory.file('outputs/apk/offline/release/viewer-offline-release-unsigned.apk')) { rename { 'viewer.apk' } }
    from(project(':viewer').layout.buildDirectory.file('outputs/apk/online/release/viewer-online-release-unsigned.apk')) { rename { 'viewer-online.apk' } }
    into layout.buildDirectory.dir('generated/viewerAsset')
}
tasks.named('preBuild') { dependsOn 'stageViewer' }
