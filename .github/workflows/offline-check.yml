name: Offline Android build check
on:
  push:
    branches: [offline-build-check]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Prepare tools and libraries with internet
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug
      - name: Rebuild APK and AAB with network physically isolated
        run: |
          set -euo pipefail
          sudo unshare --net -- ip -brief addr
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            if ip route | grep -q .; then exit 1; fi
            exec setpriv --reuid "$1" --regid "$2" --init-groups -- env "HOME=$3" "PATH=$4" "JAVA_HOME=$5" "ANDROID_HOME=$6" "GRADLE_USER_HOME=$7" "$8" --offline --no-daemon --no-build-cache --rerun-tasks :app:clean :app:assembleDebug :app:bundleDebug
          ' _ "$(id -un)" "$(id -gn)" "$HOME" "$PATH" "$JAVA_HOME" "$ANDROID_HOME" "${GRADLE_USER_HOME:-$HOME/.gradle}" "$(command -v gradle)"
      - name: Check both output files
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/bundle/debug/app-debug.aab
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/debug/app-debug.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Offline-Android-test
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
