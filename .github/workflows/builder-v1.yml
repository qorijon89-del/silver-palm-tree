name: Android Builder 0.3 private integration
on:
  push:
    branches: [builder-v03-private]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:bundleDebug
      - name: Verify Builder and embedded template
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          unzip -p "$apk" assets/viewer.apk > /tmp/viewer-template.apk
          unzip -p "$apk" assets/viewer-online.apk > /tmp/viewer-online.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if "$aapt" dump permissions /tmp/viewer-template.apk | grep -q 'android.permission.INTERNET'; then exit 1; fi
          "$aapt" dump permissions /tmp/viewer-online.apk | grep 'android.permission.INTERNET'
          "$aapt" dump badging /tmp/viewer-online.apk | grep 'tj.builder.htmlv2' 
          zipinfo -1 /tmp/viewer-template.apk
          unzip -p /tmp/viewer-template.apk assets/site/index.html | grep -F 'Барномаи HTML'
          test "$(zipinfo -1 /tmp/viewer-template.apk | grep -Ec '^res/.+[.]png$')" -eq 1
          mkdir -p deliverables
          cp "$apk" deliverables/Android-Builder-0.3.apk
      - name: Smoke-test generated APK format
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from zipfile import ZipFile
          with ZipFile('/tmp/viewer-template.apk') as original, ZipFile('/tmp/test-output-unsigned.apk','w') as new:
            for entry in original.infolist():
              if not entry.filename.startswith(('META-INF/', 'assets/site/')):
                new.writestr(entry.filename, original.read(entry), entry.compress_type)
            new.writestr('assets/site/index.html', '<html><h1>Real HTML export</h1></html>')
          PYCODE
          tools="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -keyalg RSA -keysize 2048 -alias test -keystore /tmp/preview-check.p12 -storetype PKCS12 -storepass android -keypass android -dname CN=Preview -validity 1
          "$tools/apksigner" sign --ks /tmp/preview-check.p12 --ks-key-alias test --ks-pass pass:android --key-pass pass:android --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --out /tmp/test-output.apk /tmp/test-output-unsigned.apk
          "$tools/apksigner" verify /tmp/test-output.apk
          unzip -p /tmp/test-output.apk assets/site/index.html | grep -F 'Real HTML export'
          "$tools/zipalign" -c 4 /tmp/test-output.apk
      - name: Convert a native Android ZIP to APK and AAB
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          p=Path('native-example')
          with ZipFile('deliverables/Android-Loiha-Sanjish.zip','w',ZIP_DEFLATED) as z:
            for f in sorted(p.rglob('*')):
              if f.is_file(): z.write(f, f.relative_to(p))
          PYCODE
          gradle_bin="$(command -v gradle)"
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            if ip route | grep -q .; then exit 1; fi
            exec setpriv --reuid "$1" --regid "$2" --init-groups -- env "HOME=$3" "PATH=$4" "JAVA_HOME=$5" "ANDROID_HOME=$6" "GRADLE_USER_HOME=$7" python3 scripts/build_native_zip.py deliverables/Android-Loiha-Sanjish.zip /tmp/native-output --gradle "$8" --trusted-project
          ' _ "$(id -un)" "$(id -gn)" "$HOME" "$PATH" "$JAVA_HOME" "$ANDROID_HOME" "${GRADLE_USER_HOME:-$HOME/.gradle}" "$gradle_bin"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose /tmp/native-output/app-debug.apk
          unzip -t /tmp/native-output/app-debug.aab
          cp /tmp/native-output/app-debug.apk deliverables/Android-Loiha-Sanjish.apk
          cp /tmp/native-output/app-debug.aab deliverables/Android-Loiha-Sanjish.aab
      - name: Exercise request, permission changes, build, and download over HTTP
        run: |
          set -euo pipefail
          export GRADLE_BIN="$(command -v gradle)"
          cat > /tmp/ci-build-worker <<'SH'
          #!/bin/bash
          set -euo pipefail
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            if ip route | grep -q .; then exit 1; fi
            exec setpriv --reuid "$1" --regid "$2" --init-groups -- env "HOME=$3" "PATH=$4" "JAVA_HOME=$5" "ANDROID_HOME=$6" "GRADLE_USER_HOME=$7" python3 scripts/build_native_zip.py "$9" "${10}" --format "${11}" --permissions "${12}" --trusted-project --gradle "$8"
          ' _ "$(id -un)" "$(id -gn)" "$HOME" "$PATH" "$JAVA_HOME" "$ANDROID_HOME" "${GRADLE_USER_HOME:-$HOME/.gradle}" "$GRADLE_BIN" "$1" "$2" "$3" "$4"
          SH
          chmod 700 /tmp/ci-build-worker
          BUILDER_AUTH_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(36))')"
          export BUILDER_AUTH_TOKEN
          python3 scripts/private_build_service.py --runner /tmp/ci-build-worker &
          srv=$!
          trap 'kill "$srv" || true' EXIT
          python3 scripts/smoke_service.py http://127.0.0.1:8077 deliverables/Android-Loiha-Sanjish.zip
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify /tmp/builder-service-check.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions /tmp/builder-service-check.apk | grep 'android.permission.RECORD_AUDIO'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions /tmp/builder-service-check.apk | grep 'android.permission.INTERNET'
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Builder-03-private-test
          path: deliverables/*
          if-no-files-found: error

