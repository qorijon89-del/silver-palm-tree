name: Android Builder V1 preview
on:
  push:
    branches: [builder-v1-preview]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:bundleDebug
      - name: Verify Builder and embedded template
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          unzip -p "$apk" assets/viewer.apk > /tmp/viewer-template.apk
          zipinfo -1 /tmp/viewer-template.apk
          unzip -p /tmp/viewer-template.apk assets/site/index.html | grep -F 'Барномаи HTML'
          test "$(zipinfo -1 /tmp/viewer-template.apk | grep -Ec '^res/.+[.]png$')" -eq 1
          mkdir -p deliverables
          cp "$apk" deliverables/Android-Builder-0.1.apk
      - name: Smoke-test generated APK format
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from zipfile import ZipFile
          with ZipFile('/tmp/viewer-template.apk') as original, ZipFile('/tmp/test-output-unsigned.apk','w') as new:
            for entry in original.infolist():
              if not entry.filename.startswith(('META-INF/', 'assets/site/')):
                new.writestr(entry.filename, original.read(entry), entry.compress_type)
            new.writestr('assets/site/index.html', '<html><h1>Real HTML export</h1></html>')
          PYCODE
          tools="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -keyalg RSA -keysize 2048 -alias test -keystore /tmp/preview-check.p12 -storetype PKCS12 -storepass android -keypass android -dname CN=Preview -validity 1
          "$tools/apksigner" sign --ks /tmp/preview-check.p12 --ks-key-alias test --ks-pass pass:android --key-pass pass:android --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --out /tmp/test-output.apk /tmp/test-output-unsigned.apk
          "$tools/apksigner" verify /tmp/test-output.apk
          unzip -p /tmp/test-output.apk assets/site/index.html | grep -F 'Real HTML export'
          "$tools/zipalign" -c 4 /tmp/test-output.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Builder-preview
          path: deliverables/Android-Builder-0.1.apk
          if-no-files-found: error
