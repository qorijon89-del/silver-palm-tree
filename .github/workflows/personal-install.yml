name: Android Builder personal install
on:
  push:
    branches: [builder-personal-install]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 16 SDK
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify installable file and separate app ID
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          dump="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          grep -F "package: name='tj.builder.app.personal'" <<<"$dump"
          grep -F "targetSdkVersion:'36'" <<<"$dump"
          grep -F "launchable-activity: name='tj.builder.v1.MainActivity'" <<<"$dump"
          unzip -t "$apk"
          cp "$apk" Android-Builder-1.0-Personal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Builder-personal
          path: Android-Builder-1.0-Personal.apk
          if-no-files-found: error
